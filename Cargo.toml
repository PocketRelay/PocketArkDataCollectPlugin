[package]
name = "pocket-ark-dump"
version = "0.0.1"
edition = "2021"
description = "ASI plugin for MEA to dump and log traffic"
repository = "https://github.com/PocketRelay/PocketArkDataCollectPlugin"
license = "MIT"
readme = "README.md"
authors = ["Jacobtread <jacobtread@gmail.com>"]
keywords = ["Hooking"]

[lib]
crate-type = ["cdylib"]

[dependencies]
# Shared networking backend for packet implementation
pocket-ark-blaze-networking = { version = "0.0.0", git = "https://github.com/PocketRelay/PocketArk.git", rev = "548fddeecde94f342e95b34d27a09e73eca1ba0a" }
pocket-ark-client-shared = "0.0.1"

# Logging
tracing = "0.1.44"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
log-panics = { version = "2.1.0", features = ["with-backtrace"] }

# HTTP client
reqwest = { version = "0.11", features = ["json", "gzip", "native-tls"] }

# JSON
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# TDF parsing and serialization
tdf = { version = "0.4", features = ["bytes"] }

bytes = "1.4.0"

# Async
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
futures-util = { version = "0.3", features = ["sink"] }

# HTTP primitives
hyper = { version = "0.14", features = ["server", "http1", "tcp", "runtime"] }

# Helpers to get known directories
directories = "5.0.1"

# Errors
thiserror = "1"
anyhow = "1.0.76"

# OpenSSL for HTTPS
openssl = { version = "0.10", features = ["vendored"] }
tokio-openssl = "0.6.5"

# XML parsing
quick-xml = { version = "0.31.0", features = ["serialize"] }

# Hooking
retour = "0.3.1"

# Windows libraries
[dependencies.windows-sys]
version = "0.48"
features = [
  "Win32_Foundation",
  "Win32_System_SystemServices",
  "Win32_System_Memory",
  "Win32_System_LibraryLoader",
  "Win32_System_Console",
  "Win32_Networking_WinSock",
]
